services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-mv-demo-pg
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d shop"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
